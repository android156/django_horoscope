{% extends 'horoscope/horoscope_main.html' %}
{% load static %}
{% block css_additional %}
    <link rel="stylesheet" type="text/css" href="{% static 'horoscope/css/style_elements_list.css' %}">
{% endblock %}
{% block content %}
    <ul>
        {% for element, url in elements_url_dict.items %}
            <li><a href={{ url }}>{{ element|upper }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
